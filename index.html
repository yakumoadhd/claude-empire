<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🏰 クロード帝国 3Dマップ - 中世ヨーロッパ地形 v1.0</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a1a; overflow:hidden; font-family:'Segoe UI',sans-serif; }
  canvas { display:block; }
  #ui {
    position:fixed; top:12px; left:12px; z-index:10;
    background:rgba(0,0,0,0.6); border:1px solid rgba(255,200,80,0.4);
    border-radius:8px; padding:10px 14px; color:#f0d080;
    font-size:13px; line-height:1.7; pointer-events:none;
    backdrop-filter:blur(6px);
  }
  #ui h2 { font-size:15px; margin-bottom:4px; color:#ffd060; }
  #loading {
    position:fixed; inset:0; background:#0a0a1a;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#f0d080; font-size:18px; z-index:100;
  }
  #loading .bar { width:220px; height:6px; background:#222; border-radius:3px; margin-top:18px; }
  #loading .fill { height:100%; background:linear-gradient(90deg,#c8860a,#ffd060); border-radius:3px; width:0; transition:width .4s; }
  #hint { position:fixed; bottom:12px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,0.5); color:#aaa; font-size:12px; padding:6px 14px;
    border-radius:20px; pointer-events:none; }
</style>
</head>
<body>
<div id="loading">
  <div>🏰 クロード帝国を読み込み中…</div>
  <div class="bar"><div class="fill" id="fill"></div></div>
</div>
<div id="ui" style="display:none">
  <h2>🏰 クロード帝国 3Dマップ</h2>
  中世ヨーロッパ地形 v1.0<br>
  🗻 最高峰: +65m（クロード帝国城）<br>
  🌊 最深部: -18m（深海）<br>
  🌲 樹木: 280本 | 🏰 城: Hohenzollern
</div>
<div id="hint">ドラッグ: 視点変更 ｜ ピンチ/ホイール: ズーム</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const fill = document.getElementById('fill');
const loading = document.getElementById('loading');
const ui = document.getElementById('ui');
function setProgress(v){ fill.style.width=v+'%'; }
setProgress(5);

const W = window.innerWidth, H = window.innerHeight;
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(W,H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a2a4a);
scene.fog = new THREE.FogExp2(0x2a3a5a, 0.008);

const camera = new THREE.PerspectiveCamera(55, W/H, 0.5, 800);
camera.position.set(0, 90, 130);
camera.lookAt(0,0,0);

const sun = new THREE.DirectionalLight(0xfff4d0, 1.8);
sun.position.set(-60, 120, 80);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near=1; sun.shadow.camera.far=400;
sun.shadow.camera.left=-120; sun.shadow.camera.right=120;
sun.shadow.camera.top=120; sun.shadow.camera.bottom=-120;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0x6080c0, 0x403820, 0.7));
scene.add(new THREE.AmbientLight(0x203040, 0.5));

setProgress(20);

function smoothNoise(x,y){
  const ix=Math.floor(x), iy=Math.floor(y);
  const fx=x-ix, fy=y-iy;
  const ux=fx*fx*(3-2*fx), uy=fy*fy*(3-2*fy);
  const h=(a,b)=>{let v=Math.sin(a*127.1+b*311.7)*43758.5453;return v-Math.floor(v);};
  return (
    h(ix,iy)*(1-ux)*(1-uy)+
    h(ix+1,iy)*ux*(1-uy)+
    h(ix,iy+1)*(1-ux)*uy+
    h(ix+1,iy+1)*ux*uy
  );
}
function fbm(x,y){
  let v=0,a=0.5,f=1;
  for(let i=0;i<6;i++){v+=a*smoothNoise(x*f,y*f);a*=0.5;f*=2.1;}
  return v;
}

const SEG=128, SIZE=200;
const geo = new THREE.PlaneGeometry(SIZE,SIZE,SEG,SEG);
geo.rotateX(-Math.PI/2);
const pos = geo.attributes.position;
const heights = new Float32Array(pos.count);

for(let i=0;i<pos.count;i++){
  const x=pos.getX(i)/SIZE, z=pos.getZ(i)/SIZE;
  const base = fbm(x*3+10, z*3+10)*2-1;
  const dNW = Math.sqrt((x+0.35)**2+(z+0.35)**2);
  const mountain = Math.exp(-dNW*dNW*8)*1.0;
  const dSE = Math.max(0, x*2+z*2-1.2);
  const ocean = -dSE*0.3;
  let h = base*30 + mountain*65 + ocean*20;
  if(h<-18) h=-18;
  heights[i]=h;
  pos.setY(i,h);
}
pos.needsUpdate=true;
geo.computeVertexNormals();

const colors=[];
for(let i=0;i<pos.count;i++){
  const h=heights[i];
  let r,g,b;
  if(h<-10){r=0.05;g=0.15;b=0.45;}
  else if(h<-2){r=0.1;g=0.3;b=0.6;}
  else if(h<2){r=0.75;g=0.72;b=0.55;}
  else if(h<18){r=0.25;g=0.5;b=0.2;}
  else if(h<38){r=0.35;g=0.42;b=0.28;}
  else if(h<55){r=0.45;g=0.38;b=0.3;}
  else{r=0.92;g=0.95;b=0.98;}
  colors.push(r,g,b);
}
geo.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));

const mat = new THREE.MeshLambertMaterial({vertexColors:true,side:THREE.FrontSide});
const terrain = new THREE.Mesh(geo,mat);
terrain.receiveShadow=true;
scene.add(terrain);
setProgress(45);

const waterGeo = new THREE.PlaneGeometry(SIZE,SIZE,1,1);
waterGeo.rotateX(-Math.PI/2);
const waterMat = new THREE.MeshLambertMaterial({color:0x1040a0, transparent:true, opacity:0.72});
const water = new THREE.Mesh(waterGeo,waterMat);
water.position.y=-1.5;
scene.add(water);
setProgress(55);

const treeColors=[0x2d6a2d,0x1e5c1e,0x3d7a2d,0x4a6a1a];
const trunkGeo=new THREE.CylinderGeometry(0.15,0.25,2,5);
const leafGeo=new THREE.ConeGeometry(1.2,3,6);
treeColors.forEach((col,ci)=>{
  const n=70;
  const trunkMat=new THREE.MeshLambertMaterial({color:0x5c3d1a});
  const leafMat=new THREE.MeshLambertMaterial({color:col});
  const trunks=new THREE.InstancedMesh(trunkGeo,trunkMat,n);
  const leaves=new THREE.InstancedMesh(leafGeo,leafMat,n);
  trunks.castShadow=true; leaves.castShadow=true;
  const dummy=new THREE.Object3D();
  let placed=0, tries=0;
  while(placed<n && tries<2000){
    tries++;
    const tx=(Math.random()-0.5)*SIZE*0.85;
    const tz=(Math.random()-0.5)*SIZE*0.85;
    const xi=Math.floor((tx/SIZE+0.5)*SEG), zi=Math.floor((tz/SIZE+0.5)*SEG);
    const idx=zi*(SEG+1)+xi;
    const th=heights[Math.min(idx,heights.length-1)]||0;
    if(th<2||th>50) continue;
    const sc=0.7+Math.random()*0.6;
    dummy.position.set(tx,th+1,tz);
    dummy.scale.set(sc,sc,sc);
    dummy.updateMatrix();
    trunks.setMatrixAt(placed,dummy.matrix);
    dummy.position.set(tx,th+3.5*sc,tz);
    dummy.updateMatrix();
    leaves.setMatrixAt(placed,dummy.matrix);
    placed++;
  }
  trunks.instanceMatrix.needsUpdate=true;
  leaves.instanceMatrix.needsUpdate=true;
  scene.add(trunks); scene.add(leaves);
});
setProgress(70);

function addCastleFallback(x,y,z){
  const base=new THREE.BoxGeometry(6,8,6);
  const tower=new THREE.CylinderGeometry(1.5,1.5,12,8);
  const mat2=new THREE.MeshLambertMaterial({color:0x8a7a6a});
  const bm=new THREE.Mesh(base,mat2); bm.position.set(x,y+4,z); bm.castShadow=true;
  const tm=new THREE.Mesh(tower,mat2); tm.position.set(x,y+14,z); tm.castShadow=true;
  const coneMat=new THREE.MeshLambertMaterial({color:0x6a3020});
  const cone=new THREE.Mesh(new THREE.ConeGeometry(2,4,8),coneMat);
  cone.position.set(x,y+20,z);
  scene.add(bm,tm,cone);
  const flagPole=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,5,5),
    new THREE.MeshLambertMaterial({color:0xc0a060}));
  flagPole.position.set(x,y+24,z); scene.add(flagPole);
}

addCastleFallback(-55, 60, -55);

const flagGeo=new THREE.PlaneGeometry(3,2);
const flagMat=new THREE.MeshLambertMaterial({color:0xffd040,side:THREE.DoubleSide});
const flag=new THREE.Mesh(flagGeo,flagMat);
flag.position.set(-53.5,86,-55);
scene.add(flag);
setProgress(85);

let isDragging=false, lastX=0, lastY=0;
let theta=0.3, phi=0.85, radius=150;
const target=new THREE.Vector3(0,10,0);

function updateCamera(){
  const x=target.x+radius*Math.sin(phi)*Math.sin(theta);
  const y=target.y+radius*Math.cos(phi);
  const z=target.z+radius*Math.sin(phi)*Math.cos(theta);
  camera.position.set(x,y,z);
  camera.lookAt(target);
}
updateCamera();

renderer.domElement.addEventListener('mousedown',e=>{isDragging=true;lastX=e.clientX;lastY=e.clientY;});
window.addEventListener('mouseup',()=>isDragging=false);
window.addEventListener('mousemove',e=>{
  if(!isDragging)return;
  theta-=(e.clientX-lastX)*0.005;
  phi=Math.max(0.1,Math.min(Math.PI*0.48,phi+(e.clientY-lastY)*0.005));
  lastX=e.clientX;lastY=e.clientY;
  updateCamera();
});
renderer.domElement.addEventListener('wheel',e=>{
  radius=Math.max(40,Math.min(300,radius+e.deltaY*0.2));
  updateCamera();
},{passive:true});

let lastDist=0, lastTX=0, lastTY=0;
renderer.domElement.addEventListener('touchstart',e=>{
  if(e.touches.length===1){isDragging=true;lastTX=e.touches[0].clientX;lastTY=e.touches[0].clientY;}
  else if(e.touches.length===2){
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    lastDist=Math.sqrt(dx*dx+dy*dy);
  }
},{passive:true});
renderer.domElement.addEventListener('touchend',()=>{isDragging=false;},{passive:true});
renderer.domElement.addEventListener('touchmove',e=>{
  if(e.touches.length===1&&isDragging){
    theta-=(e.touches[0].clientX-lastTX)*0.005;
    phi=Math.max(0.1,Math.min(Math.PI*0.48,phi+(e.touches[0].clientY-lastTY)*0.005));
    lastTX=e.touches[0].clientX;lastTY=e.touches[0].clientY;
    updateCamera();
  } else if(e.touches.length===2){
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    const dist=Math.sqrt(dx*dx+dy*dy);
    radius=Math.max(40,Math.min(300,radius+(lastDist-dist)*0.5));
    lastDist=dist;
    updateCamera();
  }
},{passive:true});

let t=0;
function animate(){
  requestAnimationFrame(animate);
  t+=0.016;
  water.position.y=-1.5+Math.sin(t*0.8)*0.15;
  waterMat.opacity=0.68+Math.sin(t*1.2)*0.04;
  flag.rotation.y=Math.sin(t*2)*0.3;
  renderer.render(scene,camera);
}

window.addEventListener('resize',()=>{
  const w=window.innerWidth,h=window.innerHeight;
  camera.aspect=w/h; camera.updateProjectionMatrix();
  renderer.setSize(w,h);
});

setProgress(100);
setTimeout(()=>{
  loading.style.display='none';
  ui.style.display='block';
  animate();
},600);
</script>
</body>
</html>
