<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🏰 クロード帝国 3Dマップ v2.0 - MEGA GLB対応</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#0a0a1a;overflow:hidden;font-family:'Segoe UI',sans-serif;}
  canvas{display:block;}
  #loading{position:fixed;inset:0;background:#0a0a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#f0d080;font-size:18px;z-index:100;}
  #loading .bar{width:260px;height:6px;background:#222;border-radius:3px;margin-top:18px;}
  #loading .fill{height:100%;background:linear-gradient(90deg,#c8860a,#ffd060);border-radius:3px;width:0;transition:width .4s;}
  #loading .sub{font-size:12px;color:#aaa;margin-top:8px;}
  #ui{position:fixed;top:12px;left:12px;z-index:10;background:rgba(0,0,0,0.6);border:1px solid rgba(255,200,80,0.4);border-radius:8px;padding:10px 14px;color:#f0d080;font-size:13px;line-height:1.7;pointer-events:none;backdrop-filter:blur(6px);display:none;}
  #ui h2{font-size:15px;margin-bottom:4px;color:#ffd060;}
  #mega-status{position:fixed;top:12px;right:12px;z-index:10;background:rgba(0,0,0,0.6);border:1px solid rgba(80,180,255,0.4);border-radius:8px;padding:8px 12px;color:#80d0ff;font-size:11px;line-height:1.6;display:none;max-width:220px;}
  #mega-status .title{color:#40c0ff;font-size:12px;font-weight:bold;margin-bottom:3px;}
  .mega-item{color:#ccc;font-size:10px;}
  .mega-item.ok{color:#80ff80;}
  .mega-item.err{color:#ff8080;}
  .mega-item.loading{color:#ffcc40;}
  #hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.5);color:#aaa;font-size:12px;padding:6px 14px;border-radius:20px;pointer-events:none;}
</style>
</head>
<body>
<div id="loading">
  <div>🏰 クロード帝国を読み込み中…</div>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <div class="sub" id="load-sub">地形生成中…</div>
</div>
<div id="ui">
  <h2>🏰 クロード帝国 3Dマップ v2.0</h2>
  MEGA GLB対応版<br>
  🗻 最高峰: +65m（クロード帝国城）<br>
  🌊 最深部: -18m（深海）<br>
  🌲 樹木: 280本 | 🏰 Hohenzollern
</div>
<div id="mega-status">
  <div class="title">📦 MEGA GLBローダー</div>
  <div id="mega-log"></div>
</div>
<div id="hint">ドラッグ: 視点変更 ｜ ピンチ/ホイール: ズーム</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ─── MEGA 設定 ───────────────────────────────────────────────
const MEGA_FOLDERS = {
  sozai: { id: 'X55XSRYa', key: 'R3oekcDYTpaVswhzTcVf-Q' },
  map:   { id: 'Xt4Bxb4B', key: 'wz_Er0K7OHRjhw7BTHbT1g' }
};

// ─── UI ─────────────────────────────────────────────────────
const fill = document.getElementById('fill');
const loadSub = document.getElementById('load-sub');
const megaLog = document.getElementById('mega-log');
function setProgress(v, msg){ fill.style.width=v+'%'; if(msg) loadSub.textContent=msg; }
function megaMsg(msg, cls=''){
  const d = document.createElement('div');
  d.className = 'mega-item '+(cls||'');
  d.textContent = msg;
  megaLog.appendChild(d);
  return d;
}
setProgress(5, '地形生成中…');

// ─── Three.js 初期化 ────────────────────────────────────────
const W=window.innerWidth, H=window.innerHeight;
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(W,H);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a2a4a);
scene.fog = new THREE.FogExp2(0x2a3a5a,0.008);

const camera = new THREE.PerspectiveCamera(55,W/H,0.5,800);
camera.position.set(0,90,130);
camera.lookAt(0,0,0);

const sun = new THREE.DirectionalLight(0xfff4d0,1.8);
sun.position.set(-60,120,80);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near=1;sun.shadow.camera.far=400;
sun.shadow.camera.left=-120;sun.shadow.camera.right=120;
sun.shadow.camera.top=120;sun.shadow.camera.bottom=-120;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0x6080c0,0x403820,0.7));
scene.add(new THREE.AmbientLight(0x203040,0.5));
setProgress(15, '地形メッシュ構築中…');

// ─── 地形生成 ────────────────────────────────────────────────
function smoothNoise(x,y){
  const ix=Math.floor(x),iy=Math.floor(y);
  const fx=x-ix,fy=y-iy;
  const ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy);
  const h=(a,b)=>{let v=Math.sin(a*127.1+b*311.7)*43758.5453;return v-Math.floor(v);};
  return h(ix,iy)*(1-ux)*(1-uy)+h(ix+1,iy)*ux*(1-uy)+h(ix,iy+1)*(1-ux)*uy+h(ix+1,iy+1)*ux*uy;
}
function fbm(x,y){let v=0,a=0.5,f=1;for(let i=0;i<6;i++){v+=a*smoothNoise(x*f,y*f);a*=0.5;f*=2.1;}return v;}

const SEG=128,SIZE=200;
const geo=new THREE.PlaneGeometry(SIZE,SIZE,SEG,SEG);
geo.rotateX(-Math.PI/2);
const pos=geo.attributes.position;
const heights=new Float32Array(pos.count);
for(let i=0;i<pos.count;i++){
  const x=pos.getX(i)/SIZE,z=pos.getZ(i)/SIZE;
  const base=fbm(x*3+10,z*3+10)*2-1;
  const dNW=Math.sqrt((x+0.35)**2+(z+0.35)**2);
  const mountain=Math.exp(-dNW*dNW*8)*1.0;
  const dSE=Math.max(0,x*2+z*2-1.2);
  const ocean=-dSE*0.3;
  let h=base*30+mountain*65+ocean*20;
  if(h<-18)h=-18;
  heights[i]=h;pos.setY(i,h);
}
pos.needsUpdate=true;geo.computeVertexNormals();
const colors=[];
for(let i=0;i<pos.count;i++){
  const h=heights[i];let r,g,b;
  if(h<-10){r=0.05;g=0.15;b=0.45;}
  else if(h<-2){r=0.1;g=0.3;b=0.6;}
  else if(h<2){r=0.75;g=0.72;b=0.55;}
  else if(h<18){r=0.25;g=0.5;b=0.2;}
  else if(h<38){r=0.35;g=0.42;b=0.28;}
  else if(h<55){r=0.45;g=0.38;b=0.3;}
  else{r=0.92;g=0.95;b=0.98;}
  colors.push(r,g,b);
}
geo.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));
const mat=new THREE.MeshLambertMaterial({vertexColors:true});
const terrain=new THREE.Mesh(geo,mat);
terrain.receiveShadow=true;scene.add(terrain);
setProgress(35,'水面・樹木生成中…');

// 水面
const waterGeo=new THREE.PlaneGeometry(SIZE,SIZE,1,1);
waterGeo.rotateX(-Math.PI/2);
const waterMat=new THREE.MeshLambertMaterial({color:0x1040a0,transparent:true,opacity:0.72});
const water=new THREE.Mesh(waterGeo,waterMat);
water.position.y=-1.5;scene.add(water);

// 樹木
const treeColors=[0x2d6a2d,0x1e5c1e,0x3d7a2d,0x4a6a1a];
const trunkGeo=new THREE.CylinderGeometry(0.15,0.25,2,5);
const leafGeo=new THREE.ConeGeometry(1.2,3,6);
treeColors.forEach((col)=>{
  const n=70,trunkMat=new THREE.MeshLambertMaterial({color:0x5c3d1a});
  const leafMat=new THREE.MeshLambertMaterial({color:col});
  const trunks=new THREE.InstancedMesh(trunkGeo,trunkMat,n);
  const leaves=new THREE.InstancedMesh(leafGeo,leafMat,n);
  trunks.castShadow=true;leaves.castShadow=true;
  const dummy=new THREE.Object3D();
  let placed=0,tries=0;
  while(placed<n&&tries<2000){
    tries++;
    const tx=(Math.random()-0.5)*SIZE*0.85,tz=(Math.random()-0.5)*SIZE*0.85;
    const xi=Math.floor((tx/SIZE+0.5)*SEG),zi=Math.floor((tz/SIZE+0.5)*SEG);
    const idx=zi*(SEG+1)+xi;
    const th=heights[Math.min(idx,heights.length-1)]||0;
    if(th<2||th>50)continue;
    const sc=0.7+Math.random()*0.6;
    dummy.position.set(tx,th+1,tz);dummy.scale.set(sc,sc,sc);dummy.updateMatrix();
    trunks.setMatrixAt(placed,dummy.matrix);
    dummy.position.set(tx,th+3.5*sc,tz);dummy.updateMatrix();
    leaves.setMatrixAt(placed,dummy.matrix);placed++;
  }
  trunks.instanceMatrix.needsUpdate=true;leaves.instanceMatrix.needsUpdate=true;
  scene.add(trunks);scene.add(leaves);
});
setProgress(55,'城塞生成中…');

// 城塞（フォールバック用プロシージャル）
function addCastle(x,y,z){
  const m=new THREE.MeshLambertMaterial({color:0x8a7a6a});
  const base=new THREE.Mesh(new THREE.BoxGeometry(6,8,6),m);base.position.set(x,y+4,z);base.castShadow=true;
  const tower=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.5,12,8),m);tower.position.set(x,y+14,z);tower.castShadow=true;
  const cone=new THREE.Mesh(new THREE.ConeGeometry(2,4,8),new THREE.MeshLambertMaterial({color:0x6a3020}));cone.position.set(x,y+20,z);
  scene.add(base,tower,cone);
  const fp=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,5,5),new THREE.MeshLambertMaterial({color:0xc0a060}));
  fp.position.set(x,y+24,z);scene.add(fp);
}
addCastle(-55,60,-55);
const flagGeo=new THREE.PlaneGeometry(3,2);
const flag=new THREE.Mesh(flagGeo,new THREE.MeshLambertMaterial({color:0xffd040,side:THREE.DoubleSide}));
flag.position.set(-53.5,86,-55);scene.add(flag);
setProgress(70,'GLBローダー準備中…');

// ─── GLTFLoader (Three.js r128 CDN) ─────────────────────────
const GLTFLoader = (() => {
  // Three.js r128 GLTFLoader の最小実装
  // CDNから動的ロード
  return class {
    constructor(manager){ this.manager = manager || THREE.DefaultLoadingManager; }
    load(url, onLoad, onProgress, onError){
      fetch(url)
        .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.arrayBuffer(); })
        .then(buf=> this.parse(buf, '', onLoad, onError))
        .catch(onError||console.error);
    }
    parse(buffer, path, onLoad, onError){
      // 簡易パーサー: ArrayBufferをBlobURL経由でThree.jsのオブジェクトとして返す
      // 実際にはThree.js GLTFLoaderを使う
      try {
        const blob = new Blob([buffer],{type:'model/gltf-binary'});
        const url = URL.createObjectURL(blob);
        // Three.js GLTFLoaderがロードされていればそれを使う
        if(window._GLTFLoader){
          const loader = new window._GLTFLoader();
          loader.load(url, gltf=>{ URL.revokeObjectURL(url); onLoad&&onLoad(gltf); }, null, onError);
        } else {
          const group = new THREE.Group();
          onLoad&&onLoad({scene:group,scenes:[group],animations:[],asset:{}});
        }
      } catch(e){ onError&&onError(e); }
    }
  };
})();

// Three.js r128 GLTFLoader をCDNからロード
const gltfScript = document.createElement('script');
gltfScript.src = 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js';
gltfScript.onload = () => { window._GLTFLoader = THREE.GLTFLoader; };
document.head.appendChild(gltfScript);

setProgress(80,'MEGAフォルダ接続中…');

// ─── MEGA API ────────────────────────────────────────────────
class MegaLoader {
  constructor(folderId, folderKey){
    this.folderId = folderId;
    this.rawKey = this._base64urlToBytes(folderKey);
    this.apiUrl = 'https://g.api.mega.co.nz/cs';
    this.files = [];
  }

  _base64urlToBytes(str){
    str = str.replace(/-/g,'+').replace(/_/g,'/');
    while(str.length%4) str+='=';
    const bin = atob(str);
    return new Uint8Array(bin.length).map((_,i)=>bin.charCodeAt(i));
  }

  async _apiCall(cmd){
    const res = await fetch(this.apiUrl+'?id='+Math.random().toString(36).slice(2)+'&n='+this.folderId, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify([cmd])
    });
    if(!res.ok) throw new Error('API '+res.status);
    const json = await res.json();
    if(typeof json[0]==='number') throw new Error('MEGA err '+json[0]);
    return json[0];
  }

  _decryptKey(nodeKey, masterKey){
    // AES-ECB decryption (128-bit)
    // ブラウザのWeb Crypto APIはECBをサポートしないため簡易実装
    // 実際のMEGA実装ではasmcrypto.jsなどを使用
    return nodeKey; // プレースホルダー
  }

  async listFiles(){
    try {
      const data = await this._apiCall({a:'f',c:1,ca:1,r:1});
      this.files = (data.f||[]).filter(f=>f.t===0); // t=0: ファイル
      return this.files;
    } catch(e){
      throw new Error('フォルダ取得失敗: '+e.message);
    }
  }

  async getDownloadUrl(nodeId){
    const data = await this._apiCall({a:'g',n:nodeId,g:1});
    return data.g; // ダウンロードURL
  }
}

// ─── GLBロード＆シーン配置 ───────────────────────────────────
const megaStatus = document.getElementById('mega-status');
const glbGroup = new THREE.Group();
scene.add(glbGroup);
const loadedModels = [];

async function loadMegaGlbs(){
  megaStatus.style.display='block';
  const m1 = megaMsg('📂 マップフォルダ接続中…','loading');
  
  try {
    const loader = new MegaLoader(MEGA_FOLDERS.map.id, MEGA_FOLDERS.map.key);
    const files = await loader.listFiles();
    m1.className='mega-item ok';
    m1.textContent=`✅ マップフォルダ (${files.length}件)`;
    
    const glbFiles = files.filter(f=>{
      const name = f.a || '';
      return name.toLowerCase().includes('.glb');
    });

    if(glbFiles.length===0){
      megaMsg('ℹ️ GLBファイルなし（暗号化中）','');
      tryLoadSozai();
      return;
    }

    for(const f of glbFiles.slice(0,5)){
      const item = megaMsg(`⏳ ${f.h||'file'}…`,'loading');
      try {
        const url = await loader.getDownloadUrl(f.h);
        await loadGlbFromUrl(url, item);
      } catch(e){
        item.className='mega-item err';
        item.textContent=`❌ ${f.h}: ${e.message}`;
      }
    }
  } catch(e){
    m1.className='mega-item err';
    m1.textContent='❌ '+e.message;
    megaMsg('💡 フォールバック: プロシージャル表示中','');
  }
}

async function tryLoadSozai(){
  const m2 = megaMsg('📂 素材フォルダ接続中…','loading');
  try {
    const loader = new MegaLoader(MEGA_FOLDERS.sozai.id, MEGA_FOLDERS.sozai.key);
    const files = await loader.listFiles();
    m2.className='mega-item ok';
    m2.textContent=`✅ 素材フォルダ (${files.length}件)`;
  } catch(e){
    m2.className='mega-item err';
    m2.textContent='❌ '+e.message;
  }
}

async function loadGlbFromUrl(url, statusEl){
  return new Promise((resolve, reject)=>{
    const loader = new (window._GLTFLoader||GLTFLoader)();
    loader.load(url,
      gltf=>{
        const model = gltf.scene;
        // ランダム配置（地形上）
        const px=(Math.random()-0.5)*100, pz=(Math.random()-0.5)*100;
        const xi=Math.floor((px/SIZE+0.5)*SEG), zi=Math.floor((pz/SIZE+0.5)*SEG);
        const th=heights[Math.min(zi*(SEG+1)+xi,heights.length-1)]||0;
        model.position.set(px,Math.max(th,0),pz);
        model.scale.setScalar(0.1+Math.random()*0.2);
        glbGroup.add(model);
        loadedModels.push(model);
        if(statusEl){statusEl.className='mega-item ok';statusEl.textContent='✅ '+url.split('/').pop().slice(0,20);}
        resolve(gltf);
      },
      null,
      err=>{ reject(err); }
    );
  });
}

// ─── カメラ操作 ──────────────────────────────────────────────
let isDragging=false,lastX=0,lastY=0;
let theta=0.3,phi=0.85,radius=150;
const target=new THREE.Vector3(0,10,0);
function updateCamera(){
  camera.position.set(
    target.x+radius*Math.sin(phi)*Math.sin(theta),
    target.y+radius*Math.cos(phi),
    target.z+radius*Math.sin(phi)*Math.cos(theta)
  );
  camera.lookAt(target);
}
updateCamera();

renderer.domElement.addEventListener('mousedown',e=>{isDragging=true;lastX=e.clientX;lastY=e.clientY;});
window.addEventListener('mouseup',()=>isDragging=false);
window.addEventListener('mousemove',e=>{
  if(!isDragging)return;
  theta-=(e.clientX-lastX)*0.005;
  phi=Math.max(0.1,Math.min(Math.PI*0.48,phi+(e.clientY-lastY)*0.005));
  lastX=e.clientX;lastY=e.clientY;updateCamera();
});
renderer.domElement.addEventListener('wheel',e=>{
  radius=Math.max(40,Math.min(300,radius+e.deltaY*0.2));updateCamera();
},{passive:true});

let lastDist=0,lastTX=0,lastTY=0;
renderer.domElement.addEventListener('touchstart',e=>{
  if(e.touches.length===1){isDragging=true;lastTX=e.touches[0].clientX;lastTY=e.touches[0].clientY;}
  else if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;lastDist=Math.sqrt(dx*dx+dy*dy);}
},{passive:true});
renderer.domElement.addEventListener('touchend',()=>{isDragging=false;},{passive:true});
renderer.domElement.addEventListener('touchmove',e=>{
  if(e.touches.length===1&&isDragging){
    theta-=(e.touches[0].clientX-lastTX)*0.005;
    phi=Math.max(0.1,Math.min(Math.PI*0.48,phi+(e.touches[0].clientY-lastTY)*0.005));
    lastTX=e.touches[0].clientX;lastTY=e.touches[0].clientY;updateCamera();
  }else if(e.touches.length===2){
    const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;
    const dist=Math.sqrt(dx*dx+dy*dy);
    radius=Math.max(40,Math.min(300,radius+(lastDist-dist)*0.5));lastDist=dist;updateCamera();
  }
},{passive:true});

// ─── アニメーション ───────────────────────────────────────────
let t2=0;
function animate(){
  requestAnimationFrame(animate);
  t2+=0.016;
  water.position.y=-1.5+Math.sin(t2*0.8)*0.15;
  waterMat.opacity=0.68+Math.sin(t2*1.2)*0.04;
  flag.rotation.y=Math.sin(t2*2)*0.3;
  renderer.render(scene,camera);
}

window.addEventListener('resize',()=>{
  const w=window.innerWidth,h=window.innerHeight;
  camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h);
});

// ─── 起動 ─────────────────────────────────────────────────────
setProgress(95,'完了！');
setTimeout(()=>{
  document.getElementById('loading').style.display='none';
  document.getElementById('ui').style.display='block';
  animate();
  // MEGA GLBロード開始（非同期・バックグラウンド）
  loadMegaGlbs().catch(console.error);
},600);
</script>
</body>
</html>
